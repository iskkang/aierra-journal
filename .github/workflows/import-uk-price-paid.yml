name: Refresh UK Price Paid Data
on:
  workflow_dispatch:
  schedule:
    - cron: "25 7 25 * *"
permissions:
  contents: write
concurrency:
  group: uk-price-paid-refresh
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Download official annual datasets
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 --max-time 900 -o /tmp/pp-2025.csv https://price-paid-data.publicdata.landregistry.gov.uk/pp-2025.csv
          curl --fail --location --retry 3 --max-time 900 -o /tmp/pp-2026.csv https://price-paid-data.publicdata.landregistry.gov.uk/pp-2026.csv
      - name: Validate and aggregate
        run: |
          python scripts/build-market-data.py --csv /tmp/pp-2025.csv /tmp/pp-2026.csv --source-url https://www.gov.uk/government/statistical-data-sets/price-paid-data-downloads
      - name: Commit updated data
        run: |
          git config user.name "aierra-data-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/market-snapshot.json
          if ! git diff --cached --quiet; then
            git commit -m "Refresh official UK transaction data"
            git push
          fi
